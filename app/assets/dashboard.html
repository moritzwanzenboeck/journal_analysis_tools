<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Journal Analysis Tools</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182839; overflow-x: hidden; }
    body { margin: 0; min-height: 100vh; height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.75rem;
             padding: 0.75rem 1.25rem; background: #f3f6fa; border-bottom: 1px solid #ccd7e3; }
    h1 { margin: 0; font-size: 1.125rem; }
    nav { display: flex; flex-wrap: wrap; min-width: 0; gap: 0.375rem; }
    nav a { min-width: 0; overflow-wrap: anywhere; padding: 0.45rem 0.75rem;
            border-radius: 0.375rem; color: inherit; text-decoration: none; }
    nav a:hover { background: #e3ebf3; }
    nav a[aria-current] { background: #294c6e; color: white; }
    nav a:focus-visible { outline: 2px solid #294c6e; outline-offset: 2px; }
    main { flex: 1; min-height: 0; min-width: 0; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    iframe[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Journal Analysis Tools</h1>
    <nav aria-label="Journal tools">
      <a href="#projects">Create journal project</a>
      <a href="#papers">Clean and categorize papers</a>
    </nav>
  </header>
  <main>
    <noscript>Enable JavaScript to open the notebook tools.</noscript>
    <iframe id="projects-page" title="Create journal project"
            data-src="/voila/render/create_journal_analysis.ipynb" hidden></iframe>
    <iframe id="papers-page" title="Clean and categorize papers"
            data-src="/voila/render/clean_and_count_text.ipynb" hidden></iframe>
  </main>
  <script>
    const links = document.querySelectorAll('nav a');

    function showPage() {
      const active = location.hash === '#papers' ? '#papers' : '#projects';
      for (const link of links) {
        const frame = document.getElementById(`${link.hash.slice(1)}-page`);
        const selected = link.hash === active;
        frame.hidden = !selected;
        if (selected) {
          link.setAttribute('aria-current', 'page');
          if (!frame.hasAttribute('src')) frame.src = frame.dataset.src;
        } else {
          link.removeAttribute('aria-current');
        }
      }
    }

    if (location.search) history.replaceState(null, '', location.pathname + location.hash);
    window.addEventListener('hashchange', showPage);
    showPage();
  </script>
</body>
</html>
